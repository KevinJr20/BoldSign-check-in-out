{% extends "dashboard.html" %}

{% block title %}
{{ config.company_name or 'Hospitality Dashboard' }} - Register
{% endblock %}

{% block content %}
<div class="container mt-4 mx-auto">
  <div class="tab-content">
    <div class="login-section">
      <h2 class="mb-4">Register</h2>
      <form id="registerForm" method="POST" class="shadow-sm p-4">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="mb-3">
          <label for="organization_type" class="form-label">Organization Type</label>
          <select class="form-control" id="organization_type" name="organization_type" required>
            {% for type in organization_types %}
              <option value="{{ type }}">{{ type.capitalize() }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-custom w-100">Register</button>
      </form>
      <p class="text-center mt-3">Already have an account? <a href="/login">Login</a></p>
      <div id="registerMessage" class="mt-3 text-center"></div>
    </div>
  </div>
</div>

<!-- Toast for Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-4">
  <div id="registerToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Registration</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const registerForm = document.getElementById('registerForm');
  const registerMessage = document.getElementById('registerMessage');
  const registerToast = new bootstrap.Toast(document.getElementById('registerToast'));

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const organization_type = document.getElementById('organization_type').value;

    try {
      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, organization_type }),
        credentials: 'include'
      });
      const data = await response.json();

      if (data.status === 'success') {
        registerMessage.textContent = 'Registration successful! Redirecting to login...';
        registerMessage.style.color = 'green';
        document.querySelector('#registerToast .toast-body').textContent = 'Registration successful!';
        registerToast.show();
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000); // Redirect after 2 seconds
      } else {
        registerMessage.textContent = data.message || 'Registration failed';
        registerMessage.style.color = 'red';
        document.querySelector('#registerToast .toast-body').textContent = data.message || 'Registration failed';
        registerToast.show();
      }
    } catch (error) {
      console.error('Error during registration:', error);
      registerMessage.textContent = 'An error occurred. Please try again.';
      registerMessage.style.color = 'red';
      document.querySelector('#registerToast .toast-body').textContent = 'An error occurred. Please try again.';
      registerToast.show();
    }
  });
</script>
{% endblock %}

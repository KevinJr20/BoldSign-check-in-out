{% extends "dashboard.html" %}

{% block title %}{{ config.company_name or 'Attendance Dashboard' }} - Employees{% endblock %}

{% block content %}
<div class="container mt-4 mx-auto">
    <div class="tab-content">
        <div class="employee-section" id="employeeSection">
            <div class="d-flex justify-content-between align-items-center employee-header">
                <h5 class="mb-0">Employee Management</h5>
                <div class="d-flex align-items-center gap-3">
                    <button class="action-btn" id="bulkImportBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Bulk Import">
                        <i class="fas fa-upload"></i>
                    </button>
                    <button class="action-btn" id="bulkDeleteBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Bulk Delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
            <form id="employeeForm" class="employee-form shadow-sm mb-4">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="employeeId" class="form-label">Employee ID</label>
                        <input type="text" class="form-control" id="employeeId" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="employeeName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="employeeName" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="fingerprintTemplate" class="form-label">Fingerprint Template</label>
                        <input type="text" class="form-control" id="fingerprintTemplate" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="photo" class="form-label">Photo (optional)</label>
                        <input type="file" class="form-control" id="photo" accept="image/*">
                    </div>
                </div>
                <button type="submit" class="btn btn-custom">Add Employee</button>
            </form>
            <div class="table-wrapper shadow-sm rounded">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>Employee ID</th>
                            <th>Name</th>
                            <th>Fingerprint</th>
                            <th>Photo</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast for Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-4">
    <div id="employeeToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Employee Update</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    const employeeTbody = document.getElementById('employee-table-body');
    const employeeForm = document.getElementById('employeeForm');
    const selectAll = document.getElementById('selectAll');
    const bulkImportBtn = document.getElementById('bulkImportBtn');
    const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');

    let token = getCookie('access_token_cookie');

    function loadEmployees() {
        if (!token) {
            console.error('No token available for employees fetch');
            window.location.href = '/';
            return;
        }
        fetch('/employees', {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                employeeTbody.innerHTML = '';
                if (data.status === 'success' && data.employees && data.employees.length > 0) {
                    data.employees.forEach(emp => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><input type="checkbox" class="employee-select" value="${emp.employee_id}"></td>
                            <td>${emp.employee_id || 'N/A'}</td>
                            <td>${emp.name || 'N/A'}</td>
                            <td>${emp.fingerprint_template || 'N/A'}</td>
                            <td>${emp.photo_url ? `<img src="${emp.photo_url}" alt="Photo" style="width: 50px; height: 50px; object-fit: cover;">` : 'No Photo'}</td>
                            <td>
                                <button class="btn btn-sm btn-primary edit-btn" data-id="${emp.employee_id}">Edit</button>
                                <button class="btn btn-sm btn-danger delete-btn" data-id="${emp.employee_id}">Delete</button>
                            </td>
                        `;
                        employeeTbody.appendChild(row);
                    });
                } else {
                    employeeTbody.innerHTML = '<tr><td colspan="6">No employees available.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error in loadEmployees:', error);
                if (error.message.includes('403')) {
                    window.location.href = '/subscription';
                } else {
                    employeeTbody.innerHTML = '<tr><td colspan="6">Error loading employees.</td></tr>';
                }
            });
    }

    employeeForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('employee_id', document.getElementById('employeeId').value);
        formData.append('name', document.getElementById('employeeName').value);
        formData.append('fingerprint_template', document.getElementById('fingerprintTemplate').value);
        const photo = document.getElementById('photo').files[0];
        if (photo) formData.append('photo', photo);

        const method = employeeForm.dataset.employeeId ? 'PUT' : 'POST';
        const url = method === 'PUT' ? `/employees/${employeeForm.dataset.employeeId}` : '/employees';

        fetch(url, {
            method: method,
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                    document.querySelector('#employeeToast .toast-body').textContent = data.message;
                    toast.show();
                    employeeForm.reset();
                    delete employeeForm.dataset.employeeId;
                    loadEmployees();
                } else {
                    alert(data.message || 'Operation failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if (error.message.includes('403')) {
                    window.location.href = '/subscription';
                } else {
                    alert('Operation failed. Check console for details.');
                }
            });
    });

    employeeTbody.addEventListener('click', (e) => {
        if (e.target.classList.contains('edit-btn')) {
            const employeeId = e.target.dataset.id;
            const row = e.target.closest('tr');
            document.getElementById('employeeId').value = employeeId;
            document.getElementById('employeeName').value = row.cells[2].textContent;
            document.getElementById('fingerprintTemplate').value = row.cells[3].textContent;
            employeeForm.dataset.employeeId = employeeId;
        } else if (e.target.classList.contains('delete-btn')) {
            if (!confirm('Are you sure you want to delete this employee?')) return;
            const employeeId = e.target.dataset.id;
            fetch(`/employees/${employeeId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                        document.querySelector('#employeeToast .toast-body').textContent = data.message;
                        toast.show();
                        loadEmployees();
                    } else {
                        alert(data.message || 'Delete failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (error.message.includes('403')) {
                        window.location.href = '/subscription';
                    } else {
                        alert('Delete failed. Check console for details.');
                    }
                });
        }
    });

    selectAll.addEventListener('change', (e) => {
        document.querySelectorAll('.employee-select').forEach(checkbox => {
            checkbox.checked = e.target.checked;
        });
    });

    bulkImportBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.csv';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            fetch('/employees/bulk_import', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                        document.querySelector('#employeeToast .toast-body').textContent = data.message;
                        toast.show();
                        loadEmployees();
                    } else {
                        alert(data.message || 'Bulk import failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (error.message.includes('403')) {
                        window.location.href = '/subscription';
                    } else {
                        alert('Bulk import failed. Check console for details.');
                    }
                });
        };
        input.click();
    });

    bulkDeleteBtn.addEventListener('click', () => {
        const selected = Array.from(document.querySelectorAll('.employee-select:checked')).map(cb => cb.value);
        if (selected.length === 0) {
            alert('Please select at least one employee to delete.');
            return;
        }
        if (!confirm(`Are you sure you want to delete ${selected.length} employee(s)?`)) return;
        fetch('/employees/bulk_delete', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ employee_ids: selected })
        })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                    document.querySelector('#employeeToast .toast-body').textContent = data.message;
                    toast.show();
                    loadEmployees();
                } else {
                    alert(data.message || 'Bulk delete failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if (error.message.includes('403')) {
                    window.location.href = '/subscription';
                } else {
                    alert('Bulk delete failed. Check console for details.');
                }
            });
    });

    // Initial load
    if (!token) {
        window.location.href = '/';
    } else {
        loadEmployees();
    }
</script>
{% endblock %}

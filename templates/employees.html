<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <title>{{ config.company_name or 'Attendance Dashboard' }} - Employees</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
      :root[data-theme='light'] {
        --bg-color: #f8f9fa;
        --text-color: #212529;
        --header-bg: {{ config['theme']['primary_color'] or '#007bff' }};
        --header-text: #000;
        --table-bg: #fff;
        --table-header-bg: {{ config['theme']['primary_color'] or '#007bff' }};
        --table-header-text: #fff;
        --button-bg: {{ config['theme']['primary_color'] or '#007bff' }};
        --button-text: #fff;
        --modal-bg: rgba(255, 255, 255, 0.9);
        --modal-text: #212529;
        --upgrade-btn-bg: linear-gradient(90deg, #007bff, #00c4ff);
        --dropdown-bg: #fff;
        --dropdown-border: #ced4da;
        --dropdown-hover-bg: #e9ecef;
        --sidebar-bg: rgba(255, 255, 255, 0.1);
        --sidebar-text: #212529;
      }
      :root[data-theme='dark'] {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --header-bg: {{ config['theme']['secondary_color'] or '#0056b3' }};
        --header-text: #e0e0e0;
        --table-bg: #1e1e1e;
        --table-header-bg: {{ config['theme']['secondary_color'] or '#0056b3' }};
        --table-header-text: #e0e0e0;
        --button-bg: {{ config['theme']['primary_color'] or '#007bff' }};
        --button-text: #fff;
        --modal-bg: rgba(42, 42, 42, 0.9);
        --modal-text: #e0e0e0;
        --upgrade-btn-bg: linear-gradient(90deg, #0056b3, #00aaff);
        --dropdown-bg: #444;
        --dropdown-border: #666;
        --dropdown-hover-bg: #555;
        --sidebar-bg: rgba(255, 255, 255, 0.1);
        --sidebar-text: #e0e0e0;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        min-height: 100vh;
      }
      .header {
        background-color: var(--header-bg);
        color: var(--header-text);
        padding: 30px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 30px;
      }
      .logo {
        max-height: 60px;
        margin-bottom: 15px;
      }
      .table-wrapper {
        max-height: 70vh;
        overflow-y: auto;
        background-color: var(--table-bg);
        padding: 25px;
        border-radius: 10px;
      }
      table thead {
        background-color: var(--table-header-bg);
        color: var(--table-header-text);
      }
      .btn-custom {
        background: var(--upgrade-btn-bg);
        color: #fff;
        border: none;
        border-radius: 25px;
        padding: 12px 30px;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.3s;
        box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
      }
      .btn-custom:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.5);
      }
      .main-content {
        display: flex;
        flex-direction: column;
        width: 100%;
        box-sizing: border-box;
        align-items: center;
      }
      .footer {
        font-size: 0.85rem;
        margin-top: 40px;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        padding-bottom: 20px;
      }
      .nav-buttons {
        position: absolute;
        top: 30px;
        right: 30px;
        display: flex;
        gap: 25px;
      }
      .nav-btn {
        color: var(--header-text);
        font-size: 1.3rem;
        cursor: pointer;
        background: none;
        border: none;
        padding: 8px;
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-btn:hover {
        transform: scale(1.2);
      }
      .employee-section {
        margin-bottom: 40px;
        width: 90%;
        max-width: 1200px;
      }
      .employee-header {
        margin-bottom: 25px;
      }
      .gap-3 {
        gap: 20px !important;
      }
      .sidebar {
        width: 250px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        position: fixed;
        top: 20px;
        left: 0px;
        transform: none;
        height: calc(100% - 40px);
        transition: transform 0.3s ease;
        z-index: 2000;
        color: var(--sidebar-text);
      }
      .sidebar.visible {
        transform: translateX(280px);
      }
      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding: 0 20px;
      }
      .sidebar-header h4 {
        margin: 0;
        font-size: 1.5rem;
        color: var(--sidebar-text);
      }
      .sidebar-btn {
        background: none;
        border: none;
        color: var(--sidebar-text);
        font-size: 1.5rem;
        cursor: pointer;
        transition: transform 0.2s;
        padding: 5px;
      }
      .sidebar-btn:hover {
        transform: scale(1.1);
      }
      .sidebar-nav {
        list-style: none;
        padding: 0 20px;
      }
      .sidebar-nav li {
        margin-bottom: 20px;
      }
      .sidebar-nav a {
        background: none;
        border: none;
        color: var(--sidebar-text);
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        width: 100%;
        text-align: left;
        border-radius: 5px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .sidebar-nav a:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .main-content.shifted {
        margin-left: 280px;
      }
      .menu-toggle {
        position: fixed;
        top: 20px;
        left: 20px;
        background: none;
        border: none;
        color: var(--header-text);
        font-size: 1.5rem;
        z-index: 1100;
        padding: 10px;
        margin-left: 0;
        transition: transform 0.2s;
      }
      .menu-toggle:hover {
        transform: scale(1.1);
      }
      @media (max-width: 767px) {
        .sidebar {
          top: 10px;
          left: -270px;
          height: calc(100% - 20px);
        }
        .sidebar.visible {
          transform: translateX(280px);
        }
        .main-content {
          margin-left: 0;
        }
        .main-content.shifted {
          margin-left: 0;
        }
        .header {
          padding: 20px;
          padding-bottom: 70px;
        }
        .nav-buttons {
          top: 15px;
          right: 15px;
          gap: 15px;
        }
        #navMenu {
          position: absolute;
          top: 100%;
          right: 0;
          background-color: var(--header-bg);
          padding: 15px;
          border-radius: 0 0 0 10px;
          width: 160px;
        }
        .nav-buttons .nav-btn {
          display: block;
          text-align: right;
          margin-bottom: 15px;
        }
      }
    </style>
  </head>
  <body>
    <button class="menu-toggle" id="menuToggle">
      <i class="fas fa-bars"></i>
    </button>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4>Menu</h4>
        <button class="sidebar-btn" id="closeSidebar">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <ul class="sidebar-nav">
        <li>
          <a href="/employees" id="sidebarEmployeesBtn" data-bs-toggle="tooltip" data-bs-placement="right" title="Manage Employees">
            <i class="fas fa-users"></i> Employees
          </a>
        </li>
        <li>
          <a href="/users" id="sidebarUsersBtn" data-bs-toggle="tooltip" data-bs-placement="right" title="Manage Users">
            <i class="fas fa-user"></i> Users
          </a>
        </li>
        <li>
          <a href="/subscription" id="sidebarSubscriptionBtn" data-bs-toggle="tooltip" data-bs-placement="right" title="Subscription">
            <i class="fas fa-credit-card"></i> Subscription
          </a>
        </li>
        <li>
          <button id="sidebarLogoutBtn" data-bs-toggle="tooltip" data-bs-placement="right" title="Logout">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </li>
        <li>
          <button id="sidebarThemeToggle" data-bs-toggle="tooltip" data-bs-placement="right" title="Theme">
            <i class="fas fa-moon"></i> Theme
          </button>
        </li>
      </ul>
    </div>

    <div class="main-content" id="mainContent">
      <div class="header">
        <img src="{{ config.logo_url or '/static/default_logo.png' }}" alt="{{ config.company_name or 'Company' }} Logo" class="logo">
        <h2>🕒 {{ config.company_name or 'Attendance' }} Employee Management</h2>
        <p class="mb-0">Manage your employee records</p>
        <div class="nav-buttons d-flex d-md-none">
          <button class="nav-btn" id="navMenuToggle" data-bs-toggle="collapse" data-bs-target="#navMenu" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <div class="nav-buttons collapse d-md-flex" id="navMenu">
          <a class="nav-btn" href="/employees" id="employeesBtn" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Manage Employees">
            <i class="fas fa-users"></i>
          </a>
          <a class="nav-btn" href="/users" id="usersBtn" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Manage Users">
            <i class="fas fa-user"></i>
          </a>
          <a class="nav-btn" href="/subscription" id="subscriptionBtn" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Subscription">
            <i class="fas fa-credit-card"></i>
          </a>
          <button class="nav-btn" id="logoutBtn" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
          <button class="nav-btn" id="themeToggle" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Theme">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>

      <div class="container mt-5">
        <!-- Employee Management Section -->
        <div class="employee-section" id="employeeSection">
          <div class="d-flex justify-content-between align-items-center employee-header">
            <h5 class="mb-0">Employee Management</h5>
            <div class="d-flex align-items-center gap-3">
              <button class="action-btn" id="bulkImportBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Bulk Import">
                <i class="fas fa-upload"></i>
              </button>
              <button class="action-btn" id="bulkDeleteBtn" data-bs-toggle="tooltip" data-bs-placement="top" title="Bulk Delete">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
          <form id="employeeForm" class="employee-form shadow-sm mb-4">
            <div class="row">
              <div class="col-md-3 mb-3">
                <label for="employeeId" class="form-label">Employee ID</label>
                <input type="text" class="form-control" id="employeeId" required>
              </div>
              <div class="col-md-3 mb-3">
                <label for="employeeName" class="form-label">Name</label>
                <input type="text" class="form-control" id="employeeName" required>
              </div>
              <div class="col-md-3 mb-3">
                <label for="fingerprintTemplate" class="form-label">Fingerprint Template</label>
                <input type="text" class="form-control" id="fingerprintTemplate" required>
              </div>
              <div class="col-md-3 mb-3">
                <label for="photo" class="form-label">Photo (optional)</label>
                <input type="file" class="form-control" id="photo" accept="image/*">
              </div>
            </div>
            <button type="submit" class="btn btn-custom">Add Employee</button>
          </form>
          <div class="table-wrapper shadow-sm rounded">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th><input type="checkbox" id="selectAll"></th>
                  <th>Employee ID</th>
                  <th>Name</th>
                  <th>Fingerprint</th>
                  <th>Photo</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="employee-table-body">
                <!-- Populated via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Toast for Notifications -->
      <div class="toast-container position-fixed bottom-0 end-0 p-4">
        <div id="employeeToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto">Employee Update</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body"></div>
        </div>
      </div>

      <footer class="footer text-center text-muted">
        © {{ datetime.utcnow().year or 2025 }} {{ config.company_name or 'Company' }}
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const employeeTbody = document.getElementById('employee-table-body');
      const employeeForm = document.getElementById('employeeForm');
      const selectAll = document.getElementById('selectAll');
      const bulkImportBtn = document.getElementById('bulkImportBtn');
      const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const sidebarLogoutBtn = document.getElementById('sidebarLogoutBtn');
      const sidebar = document.getElementById('sidebar');
      const mainContent = document.getElementById('mainContent');
      const menuToggle = document.getElementById('menuToggle');
      const closeSidebar = document.getElementById('closeSidebar');
      const themeToggle = document.getElementById('themeToggle');
      const sidebarThemeToggle = document.getElementById('sidebarThemeToggle');

      let token = localStorage.getItem('token');

      // Initialize and manage Bootstrap tooltips
      const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
      const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl, {
        trigger: 'hover'
      }));

      // Sidebar toggle functionality
      function toggleSidebar() {
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('visible');
        mainContent.classList.toggle('shifted');
        tooltipList.forEach(tooltip => tooltip.hide());
      }

      menuToggle.addEventListener('click', toggleSidebar);
      closeSidebar.addEventListener('click', toggleSidebar);

      function loadEmployees() {
        if (!token) {
          console.error('No token available for employees fetch');
          return;
        }
        fetch('/employees', {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        })
          .then(response => {
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
          })
          .then(data => {
            employeeTbody.innerHTML = '';
            if (data.status === 'success' && data.employees && data.employees.length > 0) {
              data.employees.forEach(emp => {
                const row = document.createElement('tr');
                row.innerHTML = `
                  <td><input type="checkbox" class="employee-select" value="${emp.employee_id}"></td>
                  <td>${emp.employee_id || 'N/A'}</td>
                  <td>${emp.name || 'N/A'}</td>
                  <td>${emp.fingerprint_template || 'N/A'}</td>
                  <td>${emp.photo_url ? `<img src="${emp.photo_url}" alt="Photo" style="width: 50px; height: 50px; object-fit: cover;">` : 'No Photo'}</td>
                  <td>
                    <button class="btn btn-sm btn-primary edit-btn" data-id="${emp.employee_id}">Edit</button>
                    <button class="btn btn-sm btn-danger delete-btn" data-id="${emp.employee_id}">Delete</button>
                  </td>
                `;
                employeeTbody.appendChild(row);
              });
            } else {
              employeeTbody.innerHTML = '<tr><td colspan="6">No employees available.</td></tr>';
            }
          })
          .catch(error => {
            console.error('Error in loadEmployees:', error);
            employeeTbody.innerHTML = '<tr><td colspan="6">Error loading employees.</td></tr>';
          });
      }

      employeeForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('employee_id', document.getElementById('employeeId').value);
        formData.append('name', document.getElementById('employeeName').value);
        formData.append('fingerprint_template', document.getElementById('fingerprintTemplate').value);
        const photo = document.getElementById('photo').files[0];
        if (photo) formData.append('photo', photo);

        const method = employeeForm.dataset.employeeId ? 'PUT' : 'POST';
        const url = method === 'PUT' ? `/employees/${employeeForm.dataset.employeeId}` : '/employees';

        fetch(url, {
          method: method,
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        })
          .then(response => response.json())
          .then(data => {
            if (data.status === 'success') {
              const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
              document.querySelector('#employeeToast .toast-body').textContent = data.message;
              toast.show();
              employeeForm.reset();
              delete employeeForm.dataset.employeeId;
              loadEmployees();
            } else {
              alert(data.message || 'Operation failed');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Operation failed. Check console for details.');
          });
      });

      employeeTbody.addEventListener('click', (e) => {
        if (e.target.classList.contains('edit-btn')) {
          const employeeId = e.target.dataset.id;
          const row = e.target.closest('tr');
          document.getElementById('employeeId').value = employeeId;
          document.getElementById('employeeName').value = row.cells[2].textContent;
          document.getElementById('fingerprintTemplate').value = row.cells[3].textContent;
          employeeForm.dataset.employeeId = employeeId;
        } else if (e.target.classList.contains('delete-btn')) {
          if (!confirm('Are you sure you want to delete this employee?')) return;
          const employeeId = e.target.dataset.id;
          fetch(`/employees/${employeeId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          })
            .then(response => response.json())
            .then(data => {
              if (data.status === 'success') {
                const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                document.querySelector('#employeeToast .toast-body').textContent = data.message;
                toast.show();
                loadEmployees();
              } else {
                alert(data.message || 'Delete failed');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('Delete failed. Check console for details.');
            });
        }
      });

      selectAll.addEventListener('change', (e) => {
        document.querySelectorAll('.employee-select').forEach(checkbox => {
          checkbox.checked = e.target.checked;
        });
      });

      bulkImportBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.csv';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const formData = new FormData();
          formData.append('file', file);
          fetch('/employees/bulk_import', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          })
            .then(response => response.json())
            .then(data => {
              if (data.status === 'success') {
                const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
                document.querySelector('#employeeToast .toast-body').textContent = data.message;
                toast.show();
                loadEmployees();
              } else {
                alert(data.message || 'Bulk import failed');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('Bulk import failed. Check console for details.');
            });
        };
        input.click();
      });

      bulkDeleteBtn.addEventListener('click', () => {
        const selected = Array.from(document.querySelectorAll('.employee-select:checked')).map(cb => cb.value);
        if (selected.length === 0) {
          alert('Please select at least one employee to delete.');
          return;
        }
        if (!confirm(`Are you sure you want to delete ${selected.length} employee(s)?`)) return;
        fetch('/employees/bulk_delete', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ employee_ids: selected })
        })
          .then(response => response.json())
          .then(data => {
            if (data.status === 'success') {
              const toast = new bootstrap.Toast(document.getElementById('employeeToast'));
              document.querySelector('#employeeToast .toast-body').textContent = data.message;
              toast.show();
              loadEmployees();
            } else {
              alert(data.message || 'Bulk delete failed');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Bulk delete failed. Check console for details.');
          });
      });

      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = '/';
      });

      sidebarLogoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = '/';
      });

      const root = document.documentElement;
      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        themeToggle.querySelector('i').className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        sidebarThemeToggle.querySelector('i').className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
      }

      themeToggle.addEventListener('click', (e) => {
        e.preventDefault();
        const currentTheme = root.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
      });

      sidebarThemeToggle.addEventListener('click', (e) => {
        e.preventDefault();
        const currentTheme = root.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
      });

      const savedTheme = localStorage.getItem('theme') || 'light';
      setTheme(savedTheme);

      // Initial load
      if (!token) {
        window.location.href = '/';
      } else {
        loadEmployees();
      }
    </script>
  </body>
</html>

{% extends "dashboard.html" %}

{% block title %}Login - {{ config.company_name or 'Hospitality Dashboard' }}{% endblock %}

{% block content %}
<div class="container mt-4 mx-auto">
    <div class="tab-content">
        <div class="login-section">
            <div class="section-title">Admin Login</div>
            <form id="loginForm" class="employee-form shadow-sm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
                    <button type="submit" class="btn btn-custom">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </div>
            </form>
            <p class="mt-3 text-center">Don't have an account? <a href="/register">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% extends "dashboard.html" %}

{% block title %}{{ config.company_name or 'Attendance Dashboard' }} - Users{% endblock %}

{% block content %}
<div class="container mt-4 mx-auto">
    <div class="tab-content">
        <div class="user-section" id="userSection">
            <div class="d-flex justify-content-between align-items-center user-header">
                <h5 class="mb-0">User Management</h5>
            </div>
            <div class="table-wrapper shadow-sm rounded">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast for Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-4">
    <div id="userToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">User Update</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    const userTbody = document.getElementById('user-table-body');

    let token = getCookie('access_token_cookie');

    function loadUsers() {
        if (!token) {
            console.error('No token available for users fetch');
            window.location.href = '/';
            return;
        }
        fetch('/users', {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                userTbody.innerHTML = '';
                if (data.status === 'success' && data.users && data.users.length > 0) {
                    data.users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.username || 'N/A'}</td>
                            <td>
                                <button class="btn btn-sm btn-danger delete-btn" data-username="${user.username}">Delete</button>
                            </td>
                        `;
                        userTbody.appendChild(row);
                    });
                } else {
                    userTbody.innerHTML = '<tr><td colspan="2">No users available.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error in loadUsers:', error);
                if (error.message.includes('403')) {
                    window.location.href = '/subscription';
                } else {
                    userTbody.innerHTML = '<tr><td colspan="2">Error loading users.</td></tr>';
                }
            });
    }

    userTbody.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-btn')) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            const username = e.target.dataset.username;
            fetch(`/users/${username}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const toast = new bootstrap.Toast(document.getElementById('userToast'));
                        document.querySelector('#userToast .toast-body').textContent = data.message;
                        toast.show();
                        loadUsers();
                    } else {
                        alert(data.message || 'Delete failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (error.message.includes('403')) {
                        window.location.href = '/subscription';
                    } else {
                        alert('Delete failed. Check console for details.');
                    }
                });
        }
    });

    // Initial load
    if (!token) {
        window.location.href = '/';
    } else {
        loadUsers();
    }
</script>
{% endblock %}

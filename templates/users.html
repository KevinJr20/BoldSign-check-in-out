<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ config.company_name }} - Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        margin-top: 20px;
      }
      .table-wrapper {
        max-height: 70vh;
        overflow-y: auto;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="mb-4">Manage Users</h2>
      <a href="/" class="btn btn-primary mb-3">Back to Dashboard</a>
      <div class="table-wrapper shadow-sm p-3 rounded">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Username</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
          </tbody>
        </table>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/';
      }

      function loadUsers() {
        fetch('/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(response => response.json())
          .then(data => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            if (data.status === 'success') {
              data.users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                  <td>${user.username}</td>
                  <td>
                    <button class="btn btn-danger btn-sm delete-btn" data-username="${user.username}">Delete</button>
                  </td>
                `;
                tbody.appendChild(row);
              });
              document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                  const username = btn.getAttribute('data-username');
                  if (confirm(`Delete user ${username}?`)) {
                    fetch(`/users/${username}`, {
                      method: 'DELETE',
                      headers: { 'Authorization': `Bearer ${token}` }
                    })
                      .then(response => response.json())
                      .then(data => {
                        if (data.status === 'success') {
                          loadUsers();
                        }
                        alert(data.message);
                      });
                  }
                });
              });
            } else {
              alert(data.message);
            }
          })
          .catch(error => console.error('Error loading users:', error));
      }

      loadUsers();
    </script>
  </body>
</html>

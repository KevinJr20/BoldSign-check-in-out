<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Add' if not employee else 'Edit' }} Employee - BOSGN Check In-Out</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% extends "dashboard.html" %}
    {% block content %}
    <div class="container">
        <h1>{{ 'Add' if not employee else 'Edit' }} Employee</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('add_employee') if not employee else url_for('edit_employee', employee_id=employee.employee_id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="employee_id">Employee ID:</label>
            <input type="text" name="employee_id" id="employee_id" value="{{ employee.employee_id if employee else '' }}" {{ 'readonly' if employee else '' }} required>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" value="{{ employee.name if employee else '' }}" required>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" value="{{ employee.email if employee else '' }}">
            <label for="role">Role:</label>
            <select name="role" id="role">
                <option value="employee" {% if employee and employee.role == 'employee' %}selected{% endif %}>Employee</option>
                <option value="manager" {% if employee and employee.role == 'manager' %}selected{% endif %}>Manager</option>
            </select>
            <label for="fingerprint_template">Fingerprint Template (Optional):</label>
            <input type="text" name="fingerprint_template" id="fingerprint_template" value="{{ employee.fingerprint_template if employee else '' }}">
            <button type="submit" class="submit-btn">{{ 'Add' if not employee else 'Update' }} Employee</button>
        </form>
    </div>
    {% endblock %}
</body>
</html>

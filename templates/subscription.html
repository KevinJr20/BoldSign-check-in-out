<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - K3V0JR1 TechCorp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --border-color: #dee2e6;
            --text-color: #212529;
            --card-bg: #ffffff;
        }
        :root[data-theme='dark'] {
            --primary-color: #66b0ff;
            --border-color: #444;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
        }
        body {
            background: var(--background);
            color: var(--text-color);
            font-family: 'Arial', sans-serif;
            transition: all 0.3s ease;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .employee-list {
            width: 100%;
            list-style: none;
            padding: 0;
        }
        .employee-list li {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .footer {
            font-size: 0.85rem;
            margin-top: 40px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Management</h1>
        <section id="employeeManagementSection">
            <h2>Employees</h2>
            <ul id="employeeList" class="employee-list"></ul>
        </section>
        <footer class="footer text-center text-muted">
            © {{ datetime.utcnow().year or 2025 }} {{ config.company_name or 'K3V0JR1 TechCorp' }}
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script>
        let token = localStorage.getItem('token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                window.location.href = '/';
            } else {
                loadEmployees();
            }
        });

        async function loadEmployees() {
            try {
                console.log('Loading employees...');
                const response = await fetch('/employees', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                console.log('Employees response status:', response.status);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                console.log('Employees data:', data);
                const employeeList = document.getElementById('employeeList');
                employeeList.innerHTML = '';
                data.forEach(employee => {
                    const li = document.createElement('li');
                    li.textContent = `${employee.name} - ${employee.role}`;
                    employeeList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading employees:', error);
                alert('Failed to load employees. Check console for details.');
            }
        }
    </script>
</body>
</html>
